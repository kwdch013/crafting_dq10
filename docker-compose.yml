services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dq10-frontend
    environment:
      API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: dq10-api
    ports:
      - "8000:8000"
    restart: unless-stopped
