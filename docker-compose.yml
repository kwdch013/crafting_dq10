services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dq10-frontend
    environment:
      # 未指定ならアクセス元のホスト名から API の接続先を導出する
      # 別ホストで API を公開する場合のみ API_BASE_URL を明示する
      API_BASE_URL: ${API_BASE_URL:-}
      # 導出時に使う API 側のポート。API_PORT 変更時は自動で追従する
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: dq10-api
    volumes:
      - ./api/data:/usr/src/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
