services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dq10-frontend
    environment:
      # ブラウザから API へ到達する URL。API_PORT 変更時は自動で追従する
      API_BASE_URL: ${API_BASE_URL:-http://localhost:${API_PORT:-8000}}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: dq10-api
    volumes:
      - ./api/data:/usr/src/app/data
    ports:
      - "${API_PORT:-8000}:8000"
    restart: unless-stopped
