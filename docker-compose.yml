services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: dq10-frontend
    environment:
      # 未指定ならアクセス元のホスト名から API の接続先を導出する
      # 別ホストで API を公開する場合のみ API_BASE_URL を明示する
      API_BASE_URL: ${API_BASE_URL:-}
      # 導出時に使う API 側のポート。API_PORT 変更時は自動で追従する
      API_PORT: ${API_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: dq10-api
    environment:
      # レシピの保存先。真実源はPostgreSQLのため既定は postgres
      # 切り戻す場合は RECIPE_STORE=json を指定する
      RECIPE_STORE: ${RECIPE_STORE:-postgres}
      # PostgreSQL への接続先。認証情報を含むため .env にのみ記載する
      DATABASE_URL: ${DATABASE_URL:-}
      # export_recipes.py がフォールバックの recipes.js を書き出す先
      # WORKDIR (/usr/src/app) は api/ の配置先のため、app は別パスへマウントする
      APP_DIR: /usr/src/frontend-app
    volumes:
      - ./api/data:/usr/src/app/data
      # recipes.js はコミット対象のため、コンテナ内実行でホストへ直接反映させる
      - ./app:/usr/src/frontend-app
    ports:
      - "${API_PORT:-8000}:8000"
    networks:
      - default
      - database
    restart: unless-stopped

# 既存の postgres_db コンテナが属するネットワークを外部参照する
# (このプロジェクトでは PostgreSQL コンテナを新規に立てない)
networks:
  database:
    external: true
    name: database_default
