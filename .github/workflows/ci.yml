name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

# 同じブランチへの連続 push では古い実行を中止し、実行枠を節約する
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI 全体の既定権限を読み取り専用に制限する
permissions:
  contents: read

jobs:
  # Ruleset の required status check から参照するため、ジョブ ID は test に固定する
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 本番 Dockerfile と同じベースイメージで Node の動作を検証する
      - name: Node テスト
        run: docker run --rm -v "$PWD":/work -w /work node:22-alpine sh -c 'node --test tests/*.test.js'

      # 本番 Dockerfile と同じベースイメージで Python の動作を検証する
      # ファイル名が *.test.py のため unittest discover では拾えず、1件ずつ実行する
      # DB を必要とするテストは TEST_DATABASE_URL 未設定でスキップされる
      - name: Python テスト
        run: |
          docker run --rm -v "$PWD":/work -w /work python:3.14-slim \
            sh -c 'for f in tests/*.test.py; do echo "--- $f"; python "$f" || exit 1; done'

      # 本番用 Dockerfile と Compose 設定がビルド可能であることを検証する
      - name: アプリイメージのビルド検証
        run: docker compose build
